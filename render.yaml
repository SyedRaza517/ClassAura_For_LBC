# Render Blueprint for the EdTech Hub API.
# In Render:  New +  →  Blueprint  →  connect this repo.
# It creates the web service below; paste the secret values when prompted.
#
# The database is already hosted on Supabase — nothing to provision here.
services:
  - type: web
    name: edtech-hub-api
    runtime: node
    region: frankfurt          # closest EU region to your Supabase DB (eu-north-1)
    plan: free                 # change to "starter" ($7/mo) to stop it sleeping after 15 min idle
    rootDir: server            # the API lives in /server
    # npm install runs the server's postinstall → prisma generate.
    # migrate:deploy then applies any migration not yet in this database, in order,
    # using the LOCAL prisma bin (npx would fetch v7, which rejects this schema).
    # It only ever applies forward migrations — it never resets or drops data — and
    # a failure fails the build, so a bad migration stops the deploy instead of
    # leaving the API running against a schema it does not match.
    buildCommand: npm install && npm run migrate:deploy
    startCommand: npm start    # node src/index.js  (binds to Render's $PORT automatically)
    healthCheckPath: /api/health
    autoDeploy: true
    # WHICH BRANCH. Stated explicitly, because leaving it out means "whatever the
    # repo's default branch happens to be" — and this repo has two deploy branches
    # (main = staging, production = live), so the default is exactly the thing you do
    # not want decided by accident. A Blueprint only sets this when the service is
    # CREATED; if the live service disagrees, change it in the Render dashboard, as
    # editing this file will not move it.
    branch: production
    envVars:
      - key: NODE_ENV
        value: production        # forces the JWT_SECRET check on; enables prod behaviour
      - key: JWT_EXPIRES
        value: 1d
      # --- secrets: set these in the Render dashboard (never committed) ---
      - key: DATABASE_URL
        sync: false              # your Supabase session-pooler URL (from server/.env)
      - key: JWT_SECRET
        sync: false              # the long random secret from server/.env
      - key: CLIENT_URL
        sync: false              # your dashboard URL, e.g. https://edtech-hub.vercel.app  (set after step 2)
      - key: CORS_ORIGINS
        sync: false              # dashboard URL + mobile: "https://edtech-hub.vercel.app,capacitor://localhost,http://localhost"
      - key: APP_TIMEZONE
        value: Europe/London     # the organisation's wall clock; drives dates, the term
                                 # gate and the 02:00 Moodle sync
      # --- multi-tenancy ---
      # This file predated tenancy and never mentioned these, which is defect T9/S4 in
      # STATUS.md. Without them a multi-college deployment is quietly misconfigured.
      - key: CREDENTIALS_KEY
        sync: false              # 64 hex chars. AES-256-GCM key that encrypts every college's
                                 # own Moodle/SharePoint/SMTP credentials at rest. WITHOUT IT
                                 # no college can save an integration at all, and the failure
                                 # surfaces only when one tries. Generate:
                                 #   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
                                 # NEVER rotate it casually — every stored secret is encrypted
                                 # under it and becomes unreadable if it changes.
      - key: DEFAULT_TENANT_SLUG
        sync: false              # which college a request with no X-Tenant and no subdomain
                                 # resolves to. ALSO the only tenant permitted to inherit the
                                 # host-level MOODLE_*/SMTP_* values below — see
                                 # integrationConfig.js. Every other college resolves to "not
                                 # configured", which fails safe rather than sending mail as
                                 # somebody else.
      - key: TENANT_BASE_DOMAIN
        sync: false              # e.g. edtech-hub.example.com — lets "lbc.edtech-hub.example.com"
                                 # resolve the college from the subdomain. Leave unset for a
                                 # single-college deployment.
      # --- Moodle (VLE) import ---
      # NOTE: these are HOST-level values and now serve exactly ONE college — the one
      # named by DEFAULT_TENANT_SLUG above. Every other institution enters its own in
      # Settings → Integrations. They are no longer dangerous, but on a multi-college
      # deployment they are simply the wrong place to configure anything.
      # WITHOUT these the whole VLE feature silently does nothing in production: the
      # "Sync now" button reports "not set up" and the nightly job never runs. They
      # live in server/.env locally, which is gitignored and never reaches Render, so
      # this is a difference that only shows up once deployed.
      - key: MOODLE_URL
        sync: false              # e.g. https://lbcvle.uk  (no trailing slash, no /login)
      - key: MOODLE_TOKEN
        sync: false              # the 32-character web-services token — a secret
      - key: MOODLE_AUTO_SYNC
        value: "on"              # "off" disables the 02:00 nightly import
      # --- email ---
      # REQUIRED in production. With none of these set, sendEmail falls back to a
      # console stub: nobody receives anything, and the password-reset LINK is printed
      # into Render's log stream, where anyone with log access can use it. Render's
      # free tier also blocks outbound SMTP, so RESEND_API_KEY is the one to use.
      - key: RESEND_API_KEY
        sync: false              # preferred — HTTP API, works on the free plan
      - key: SMTP_HOST
        sync: false              # alternative to Resend; blocked on Render free
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
