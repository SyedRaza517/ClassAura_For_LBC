# Render Blueprint for the LBC Staff Hub API.
# In Render:  New +  →  Blueprint  →  connect this repo.
# It creates the web service below; paste the secret values when prompted.
#
# The database is already hosted on Supabase — nothing to provision here.
services:
  - type: web
    name: lbc-staff-hub-api
    runtime: node
    region: frankfurt          # closest EU region to your Supabase DB (eu-north-1)
    plan: free                 # change to "starter" ($7/mo) to stop it sleeping after 15 min idle
    rootDir: server            # the API lives in /server
    # npm install runs the server's postinstall → prisma generate.
    # migrate:deploy then applies any migration not yet in this database, in order,
    # using the LOCAL prisma bin (npx would fetch v7, which rejects this schema).
    # It only ever applies forward migrations — it never resets or drops data — and
    # a failure fails the build, so a bad migration stops the deploy instead of
    # leaving the API running against a schema it does not match.
    buildCommand: npm install && npm run migrate:deploy
    startCommand: npm start    # node src/index.js  (binds to Render's $PORT automatically)
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production        # forces the JWT_SECRET check on; enables prod behaviour
      - key: JWT_EXPIRES
        value: 1d
      # --- secrets: set these in the Render dashboard (never committed) ---
      - key: DATABASE_URL
        sync: false              # your Supabase session-pooler URL (from server/.env)
      - key: JWT_SECRET
        sync: false              # the long random secret from server/.env
      - key: CLIENT_URL
        sync: false              # your dashboard URL, e.g. https://lbc-hub.vercel.app  (set after step 2)
      - key: CORS_ORIGINS
        sync: false              # dashboard URL + mobile: "https://lbc-hub.vercel.app,capacitor://localhost,http://localhost"
      - key: APP_TIMEZONE
        value: Europe/London     # the organisation's wall clock; drives dates, the term
                                 # gate and the 02:00 Moodle sync
      # --- Moodle (VLE) import ---
      # WITHOUT these the whole VLE feature silently does nothing in production: the
      # "Sync now" button reports "not set up" and the nightly job never runs. They
      # live in server/.env locally, which is gitignored and never reaches Render, so
      # this is a difference that only shows up once deployed.
      - key: MOODLE_URL
        sync: false              # e.g. https://lbcvle.uk  (no trailing slash, no /login)
      - key: MOODLE_TOKEN
        sync: false              # the 32-character web-services token — a secret
      - key: MOODLE_AUTO_SYNC
        value: "on"              # "off" disables the 02:00 nightly import
      # --- email ---
      # REQUIRED in production. With none of these set, sendEmail falls back to a
      # console stub: nobody receives anything, and the password-reset LINK is printed
      # into Render's log stream, where anyone with log access can use it. Render's
      # free tier also blocks outbound SMTP, so RESEND_API_KEY is the one to use.
      - key: RESEND_API_KEY
        sync: false              # preferred — HTTP API, works on the free plan
      - key: SMTP_HOST
        sync: false              # alternative to Resend; blocked on Render free
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
