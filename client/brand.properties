# ─────────────────────────────────────────────────────────────────────────────
#  White-label identity — the ONE file a per-institution build has to change.
# ─────────────────────────────────────────────────────────────────────────────
#
# The app brands ITSELF at runtime: colours, logo and institution name all come
# from GET /api/branding, so one installed binary already looks right for whichever
# college the signed-in user belongs to.
#
# Four things cannot work that way, because the operating system reads them before
# a single line of our JavaScript runs — they are baked into the binary at build
# time and are the same for everyone who installs it:
#
#   * the home-screen app name      (app.name below)
#   * the bundle / package id       (app.id below)
#   * the launcher icon             (image files — see MOBILE.md)
#   * the splash screen             (image files + color.background below)
#
# So a genuinely per-college app means a SEPARATE BUILD, listed separately in the
# App Store and Play. What this file buys is that the separate build is a config
# change, not an edit spread across build.gradle, strings.xml, colors.xml,
# Info.plist and the Xcode project file. Everything below is read from here:
#
#   client/android/app/build.gradle        reads this file directly (java.util.Properties,
#                                          the same way it reads keystore.properties)
#   everything else                        `npm --workspace client run brand`
#                                          (scripts/apply-brand.mjs) writes it into
#                                          capacitor.config.json, Info.plist, the
#                                          .pbxproj, index.html and the web manifest
#
# The defaults here are the PLATFORM defaults — deliberately product-level and
# neutral, not any one college's. See "White-labelling a build for one institution"
# in MOBILE.md before you change them.


# ── Identity ─────────────────────────────────────────────────────────────────

# Home-screen label and store name. Keep it short: iOS truncates past ~12
# characters on the home screen. Avoid apostrophes — this string is written into
# Android resource XML verbatim.
app.name=ClassAura

# Bundle id (iOS) and applicationId (Android). Reverse-DNS, and PERMANENT:
# it is the primary key of the listing in both stores. Changing it on a published
# app does not update that app — it publishes a different one, and every existing
# install is orphaned on the old version forever.
#
# ClassAura (uk.co.classaura.app) is a NEW app as of 11 Sep 2026, starting at 1.0.0
# build 1. The older uk.co.edtech.hub is a SEPARATE, still-published listing (App Store
# Connect app 6795300712, Play versionCode 26) and is not affected by anything here.
#
# The original note follows, and still applies to whichever id a build carries:
# uk.co.edtech.hub is already live (App Store Connect app 6795300712, Play
# versionCode 26), so it is fixed for THIS app. A new institution gets a new id in
# its own copy of this file, e.g. uk.ac.<college>.staffhub.
app.id=uk.co.classaura.app

# Used for the web manifest and the <meta name="description"> of the web shell.
app.description=Timetables, attendance and check-in for staff and students.


# ── Native chrome colours ────────────────────────────────────────────────────
#
# These paint the split second BEFORE the React bundle has loaded and applied the
# tenant's real colours — the splash background, the WebView's own background, and
# the Android status bar. They are baked in, so they cannot follow /api/branding.
#
# That is exactly why the defaults are neutral rather than a brand navy: a fixed
# #1a3a8f flashed in front of a college whose palette is green or maroon reads as
# somebody else's app for the first 800ms of every launch. White is the neutral
# choice — it also matches the white-backed launcher icons and the white splash
# artwork, so nothing has a visible seam. Override per institution only if that
# college's own splash artwork needs a coloured field behind it.

# Splash + WebView background.
color.background=#FFFFFF

# Android status bar. style is LIGHT (light content, for a dark bar) or DARK
# (dark content, for a light bar) — it must contrast with color.statusBar or the
# clock and battery icons vanish.
color.statusBar=#FFFFFF
color.statusBarStyle=DARK

# AppCompat theme colours. Almost nothing native is drawn in this app, but
# colorPrimary is also the tint Android applies to our push notifications in the
# shade — so it must stay legible against a white notification background, which
# rules out white itself. Neutral slate rather than a brand hue.
color.primary=#334155
color.primaryDark=#1E293B
color.accent=#334155
