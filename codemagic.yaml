# Codemagic CI config — builds the iOS app in the cloud (no Mac needed) and
# uploads it to TestFlight / App Store Connect.
#
# ONE-TIME SETUP in the Codemagic UI (do this AFTER your Apple Developer account
# is approved and you've created the app in App Store Connect):
#   1. Sign in at codemagic.io with GitHub, add the repo "SyedRaza517/EdTech".
#   2. Team → Integrations → App Store Connect → connect an API key
#      (App Store Connect → Users and Access → Integrations → generate an API key,
#       role "App Manager"; download the .p8, note the Key ID + Issuer ID).
#      Give the integration a NAME and put that same name below in
#      `app_store_connect: <NAME>` under integrations.
#   3. App Store Connect → create the app (bundle ID uk.co.edtech.hub) — this
#      gives you the numeric "Apple ID" for the app. Put it in APP_STORE_APPLE_ID.
#   4. Push this file, then in Codemagic run the "ios-release" workflow.
#
# Nothing here needs a Mac — Codemagic provides the macOS build machine.
#
# WHITE-LABELLING: the app's name, bundle id and native chrome colours live in
# client/brand.properties, and the "Apply the white-label identity" step below writes
# them into the Xcode project before the archive. The three values in THIS file that
# name the app — ios_signing.bundle_identifier, BUNDLE_ID and APP_STORE_APPLE_ID —
# cannot read that file: Codemagic resolves them to fetch signing assets before any
# script has run. So each institution needs its own workflow (or its own repo/branch)
# with those three lines changed to match its brand.properties. See MOBILE.md.

workflows:
  ios-release:
    name: iOS App Store release
    instance_type: mac_mini_m2      # Codemagic's macOS build machine
    max_build_duration: 60
    integrations:
      # Must match the App Store Connect integration name in Codemagic → Teams →
      # Integrations exactly (the label you give the key when you connect it there).
      app_store_connect: Codemagic-Admin
    environment:
      # Codemagic-managed signing. This replaces a hand-rolled
      # `fetch-signing-files --create`, which could never have worked:
      #
      #   Cannot save Signing Certificates without certificate private key
      #   Did not find matching provisioning profiles for code signing!
      #    - Provisioning Profiles: []
      #
      # Apple never releases a certificate's private key — it only ever exists on
      # the machine that generated the signing request. So the CLI could create a
      # certificate at Apple, but had no key to pair it with, discarded it, and
      # then had nothing to match a profile against. Every downstream value came
      # out blank and the archive failed with "App requires a provisioning profile".
      #
      # With this block Codemagic generates the keypair itself, keeps it with the
      # team, and installs the certificate and profile into the build keychain
      # before the scripts run — so the private key survives between builds and
      # no new certificate is burned each time (Apple caps distribution certs).
      ios_signing:
        distribution_type: app_store
        # MUST equal app.id in client/brand.properties. Codemagic reads this before
        # the scripts run, so it cannot be derived from that file — if the two ever
        # disagree, the archive is signed for one app and built as another and the
        # upload is rejected. The "Apply the white-label identity" step below compares
        # the two and fails the build early rather than 20 minutes later.
        bundle_identifier: uk.co.edtech.hub
      vars:
        XCODE_SCHEME: "App"
        BUNDLE_ID: "uk.co.edtech.hub"
        # The packaged app has no usable host (capacitor://), so the API URL MUST be
        # baked in at build time. .env.production is gitignored and never reaches
        # this cloud build, so set it here explicitly — otherwise the app falls back
        # to http://localhost and every request dies with "Load failed" on the phone.
        # CORRECTED 2 Sep 2026. This said `edtech-hub-api.onrender.com`, which does not
        # exist and never has — 404 on every path. Every iOS build produced here since
        # was either failing the allowlist in client/vite.config.js or, worse, shipping
        # an app that could not reach any API at all. It is the THIRD wrong API host this
        # repository has carried, which is why that allowlist exists; it now compares the
        # parsed host rather than doing a substring match, so a fourth cannot slip past.
        VITE_API_URL: "https://edtech-xr8g.onrender.com/api"
        # Numeric Apple ID of the app from App Store Connect (step 3). Until you
        # have it, the "increment build number" step below will fail — set it first.
        APP_STORE_APPLE_ID: 6795300712
      node: 22
      xcode: latest
    scripts:
      - name: Install JS dependencies (monorepo root)
        script: npm ci
      - name: Apply the white-label identity
        script: |
          set -e
          # Writes app.name / app.id / the chrome colours from client/brand.properties
          # into capacitor.config.json, Info.plist and the Xcode project. Without this
          # a build would ship whatever identity happened to be committed in the native
          # project, which is the exact drift brand.properties exists to prevent.
          node client/scripts/apply-brand.mjs

          # Fail now, with the reason, rather than at the signing step with exit 65.
          # `|| true` so a missing line reports the mismatch below instead of dying
          # silently on `set -e` with no explanation.
          BRAND_ID=$(grep -E '^app\.id=' client/brand.properties | cut -d= -f2- | tr -d '[:space:]' || true)
          if [ "$BRAND_ID" != "$BUNDLE_ID" ]; then
            echo ""
            echo "FATAL: client/brand.properties app.id ($BRAND_ID) does not match this"
            echo "workflow's BUNDLE_ID / ios_signing.bundle_identifier ($BUNDLE_ID)."
            echo "Codemagic fetched the signing profile for $BUNDLE_ID before this script ran,"
            echo "so the two must agree. Fix whichever one is wrong — but note that changing"
            echo "the bundle id of a PUBLISHED app orphans every existing install."
            exit 1
          fi
      - name: Build web assets (production → Render API)
        script: |
          cd client
          npm run build
      - name: Sync Capacitor iOS project
        script: |
          cd client
          npx cap sync ios
      - name: Apply the signing profile to the Xcode project
        script: |
          set -e
          # Codemagic has already installed the certificate and profile into the
          # build keychain (see ios_signing above). This writes the profile into the
          # project so the archive can find it.
          #
          # --project is required: this step runs from the repo root, unlike the rest,
          # so without it use-profiles searches the wrong place and patches nothing.
          xcode-project use-profiles --project "client/ios/App/App.xcodeproj" --verbose

          echo "=== signing settings written into the project ==="
          grep -oE "(DEVELOPMENT_TEAM|PROVISIONING_PROFILE_SPECIFIER|CODE_SIGN_STYLE|CODE_SIGN_IDENTITY) = [^;]*" client/ios/App/App.xcodeproj/project.pbxproj | sort -u

          # Stop here with the reason rather than 36s later with a generic exit 65.
          if ! grep -q "PROVISIONING_PROFILE_SPECIFIER" client/ios/App/App.xcodeproj/project.pbxproj; then
            echo ""
            echo "FATAL: no provisioning profile was written into the Xcode project."
            echo "Codemagic did not install one. Check that the App Store Connect"
            echo "integration is attached to this workflow and that the bundle id"
            echo "$BUNDLE_ID is registered in the Apple Developer portal."
            exit 1
          fi
      - name: Set build number from latest TestFlight
        script: |
          cd client/ios/App
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          agvtool new-version -all $(($LATEST + 1))
      - name: Build .ipa
        script: |
          cd client/ios/App
          xcode-project build-ipa --project "App.xcodeproj" --scheme "$XCODE_SCHEME"
    artifacts:
      - client/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true      # lands in TestFlight for internal testers
        # submit_to_app_store: false    # flip to true later to push to App Store review
