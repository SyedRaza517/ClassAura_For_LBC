apply plugin: 'com.android.application'

// Release signing, read from android/keystore.properties — a file that is NOT
// committed (it holds the upload key's passwords). Without it the release build
// still succeeds but produces an UNSIGNED bundle, which Play rejects on upload;
// that is exactly what used to happen, silently.
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

// White-label identity, read from client/brand.properties — ONE file that also
// feeds the iOS project and the Capacitor config (see client/scripts/apply-brand.mjs).
// Loaded exactly like keystore.properties above: java.util.Properties, no plugin and
// no extra dependency, so this stays readable to anyone who knows Gradle and nothing
// else about the build.
//
// Nothing here is generated into the repository — Gradle reads the file at build
// time, so the Android side can never drift out of step with it. The fallbacks are
// the shipped app's real values, so a checkout missing the file still builds the
// app it always built rather than something subtly different.
def brandPropsFile = rootProject.file("../brand.properties")
def brandProps = new Properties()
if (brandPropsFile.exists()) {
    brandProps.load(new FileInputStream(brandPropsFile))
} else {
    logger.warn("brand.properties not found at ${brandPropsFile} — falling back to the built-in defaults.")
}
// .trim() matters: Properties.load strips whitespace before the value but keeps it
// after, so a stray trailing space in brand.properties would end up in the app's
// name — and scripts/apply-brand.mjs, which trims, would then disagree with Gradle
// about what the brand is. An empty value falls back rather than shipping "".
def brand = { String key, String fallback ->
    def v = brandProps.getProperty(key)?.trim()
    return (v == null || v.isEmpty()) ? fallback : v
}

android {
    // NOT the store identity — this is the Java package that MainActivity and the
    // generated R class live in (android/app/src/main/java/uk/co/edtech/hub/). It is
    // internal, invisible to users, and changing it means moving the source file, so
    // it deliberately does NOT follow brand.properties. applicationId below is the
    // one that identifies the app to Play, and the two are allowed to differ.
    namespace = "uk.co.edtech.hub"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        // The Play listing's primary key. Permanent for a published app — see the
        // note on app.id in brand.properties.
        //
        // THE FALLBACK MATTERS AS MUCH AS THE VALUE. It used to be uk.co.edtech.hub, the
        // OTHER app — so a build run without brand.properties would not fail, it would
        // quietly produce a binary belonging to a different published listing. A default
        // that silently builds somebody else's app is worse than no default.
        applicationId brand("app.id", "uk.co.classaura.app")

        // These used to sit in res/values/strings.xml and res/values/colors.xml.
        // They are generated from brand.properties instead so that the app name and
        // the native chrome colours have exactly one home. AAPT treats a resValue as
        // a normal resource, so @string/app_name and @color/colorPrimary resolve the
        // same as before — but the XML files must NOT also declare them, or the build
        // fails with "duplicate value for resource".
        resValue "string", "app_name", brand("app.name", "Staff Hub")
        resValue "string", "title_activity_main", brand("app.name", "Staff Hub")
        resValue "string", "package_name", brand("app.id", "uk.co.classaura.app")
        resValue "string", "custom_url_scheme", brand("app.id", "uk.co.classaura.app")
        resValue "color", "colorPrimary", brand("color.primary", "#334155")
        resValue "color", "colorPrimaryDark", brand("color.primaryDark", "#1E293B")
        resValue "color", "colorAccent", brand("color.accent", "#334155")

        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Play rejects a versionCode it has seen before, on any track — including one
        // uploaded and then discarded. It must go UP on every upload, never sideways.
        //
        // 2 (11 Sep 2026) rather than 1, even though uk.co.classaura.app has never been
        // published to Play and 1 is therefore still free. The reason is the iOS side:
        // the first App Store Connect upload of build 1 was rejected at the validation
        // gate (error 90778, the NFC entitlement, since fixed), and a rejection at that
        // gate is ambiguous about whether the number was consumed — Apple sometimes
        // keeps the record. Rather than hold the two platforms at different numbers
        // over a build that may or may not exist, both start the resubmission train at
        // 2, so "ClassAura build 2" names one thing on both stores when someone reads a
        // crash report or a TestFlight note.
        //
        // Burning versionCode 1 costs nothing — Play only requires the number to
        // increase, never to start at 1 or to be contiguous — whereas the alternative,
        // keeping Android on 1 to stay tidy, buys a permanent off-by-one between the
        // platforms in exchange for tidiness nobody ever sees.
        //
        // 3 (11 Sep 2026), one build on from 2, because a fresh build train is going out
        // carrying the QR check-in fixes and 2 may already have been fed to a build. The
        // rule from the top of this comment is the only thing that matters here: the number
        // climbs on every build meant for upload, and it is cheaper to climb than to find
        // out the hard way that Play has seen the one you are holding. Gaps are free.
        //
        // NOTE: there is no matching edit on the iOS side and that is deliberate, not
        // an oversight. codemagic.yaml's "Set build number from latest TestFlight" step
        // runs `agvtool new-version -all $(latest + 1)`, overwriting CURRENT_PROJECT_VERSION
        // in the .pbxproj during every cloud build. A number committed here would be
        // discarded before the archive, so hardcoding one would only create a value that
        // disagrees with what actually ships. Bump Android by hand; let Codemagic count
        // for iOS. (The MARKETING version is the exception: it IS committed, in the
        // .pbxproj's MARKETING_VERSION, and moves with versionName below.)
        //
        // 4 (13 Sep 2026), and versionName 1.0.0 -> 1.1.0 with it: a new build train
        // carries the first FEATURE release since launch — student push notifications
        // and the in-app inbox, mitigating-circumstances self-service, streaks and
        // badges, the Due-next agenda, Teams join links, dark mode and the design
        // refresh. The build number climbs because it always climbs; the marketing
        // version climbs because this is the first time the app's capabilities changed
        // rather than its fixes.
        //
        // 6 (16 Oct 2026), versionName 1.1.1 -> 1.1.2. The first ClassAura build made
        // against the COLLEGE'S OWN API: every earlier one was aimed at the EdTech
        // deployment this repository was forked from, so nothing a user did in it could
        // reach London Brookes' database. No capability changed, which is why the
        // marketing version moves by a patch and not a minor — but it is the first
        // build of this app that is wired to the right system at all.
        versionCode 6
        versionName "1.1.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Only attach the config when the properties file is actually present, so
            // a machine without the key (CI, a fresh clone) still builds rather than
            // failing on a missing keystore.
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
